<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yutri — Gestor de Menús</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --green-900: #1B4332; --green-800: #2D6A4F; --green-700: #40916C;
  --green-600: #52B788; --green-200: #B7E4C7; --green-100: #D8F3DC; --green-50: #F0FDF4;
  --amber: #F59E0B; --red: #EF4444; --blue: #3B82F6;
  --bg: #FAFAF8; --surface: #FFFFFF; --border: #E8E8E4;
  --text: #1A1A18; --muted: #6B6B65; --radius: 10px; --radius-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { background: var(--green-900); color: #fff; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.main { padding: 32px 40px; overflow-y: auto; }
.logo { padding: 28px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.logo-text { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.logo-sub { font-size: 11px; opacity: 0.5; margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase; }
.nav-section { padding: 16px 12px 8px; }
.nav-label { font-size: 10px; opacity: 0.4; letter-spacing: 1px; text-transform: uppercase; padding: 0 12px; margin-bottom: 6px; }
.nav-week { padding: 8px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500; opacity: 0.6; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
.nav-week:hover { opacity: 0.9; background: rgba(255,255,255,0.07); }
.nav-week.active { opacity: 1; background: rgba(255,255,255,0.12); }
.nav-week .badge { font-size: 10px; background: var(--green-600); color: #fff; padding: 2px 7px; border-radius: 20px; margin-left: auto; }
.nav-day { padding: 6px 12px 6px 28px; border-radius: var(--radius); cursor: pointer; font-size: 12px; opacity: 0.55; transition: all 0.15s; }
.nav-day:hover { opacity: 0.85; background: rgba(255,255,255,0.05); }
.nav-day.active { opacity: 1; color: var(--green-200); font-weight: 500; }
.sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; opacity: 0.35; text-align: center; }
.page-header { margin-bottom: 28px; }
.page-title { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
.page-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
.stats-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 28px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 22px; font-weight: 600; font-family: 'DM Mono', monospace; }
.stat-value.ok { color: var(--green-700); }
.stat-value.warn { color: var(--amber); }
.stat-value.bad { color: var(--red); }
.stat-diff { font-size: 11px; color: var(--muted); margin-top: 2px; }
.meal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 16px; overflow: hidden; }
.meal-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.meal-header-left { display: flex; align-items: center; gap: 12px; }
.meal-pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
.pill-desayuno { background: #FEF3C7; color: #92400E; }
.pill-almuerzo { background: #DBEAFE; color: #1E40AF; }
.pill-merienda { background: #FCE7F3; color: #9D174D; }
.pill-cena     { background: #EDE9FE; color: #5B21B6; }
.pill-colacion { background: var(--green-100); color: var(--green-800); }
.meal-name { font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 4px; padding: 1px 4px; transition: background 0.15s; }
.meal-name:hover { background: var(--green-100); color: var(--green-800); }
.meal-name-input { font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif; border: 1.5px solid var(--green-600); border-radius: 4px; padding: 1px 6px; background: var(--surface); color: var(--text); outline: none; min-width: 200px; width: 100%; max-width: 420px; }
.meal-kcal { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; color: var(--green-700); background: var(--green-50); padding: 4px 10px; border-radius: 6px; }
.meal-body { border-top: 1px solid var(--border); }
.meal-body.collapsed { display: none; }
.ingr-table { width: 100%; border-collapse: collapse; }
.ingr-table th { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 8px 12px; text-align: right; background: var(--bg); border-bottom: 1px solid var(--border); }
.ingr-table th:first-child { text-align: left; }
.ingr-table td { font-size: 12px; padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--border); color: var(--text); }
.ingr-table td:first-child { text-align: left; }
.ingr-table tr:last-child td { border-bottom: none; }
.ingr-table tbody tr:hover td { background: var(--green-50); }
.gram-input { width: 70px; padding: 4px 8px; border-radius: 6px; border: 1.5px solid #BFDBFE; text-align: center; font-size: 12px; font-family: 'DM Mono', monospace; color: #1E40AF; font-weight: 500; background: #EFF6FF; transition: border-color 0.15s; }
.gram-input:focus { outline: none; border-color: var(--blue); }
.ref-val { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; }
.calc-val { font-family: 'DM Mono', monospace; font-size: 12px; }
.del-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 2px 6px; border-radius: 4px; transition: all 0.15s; }
.del-btn:hover { color: var(--red); background: #FEE2E2; }
.total-row td { font-weight: 600; font-size: 12px; background: var(--green-50); color: var(--green-800); font-family: 'DM Mono', monospace; border-top: 1px solid var(--green-200); }
.total-row td:first-child { font-family: 'DM Sans', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ── Add ingredient area ── */
.add-area { padding: 12px 16px; background: var(--bg); border-top: 1px dashed var(--border); }
.add-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.add-input { flex: 1; min-width: 200px; padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 13px; font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); transition: border-color 0.15s; }
.add-input:focus { outline: none; border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(64,145,108,0.1); }
.add-input::placeholder { color: var(--muted); }
.add-btn { padding: 8px 16px; border-radius: var(--radius); border: none; font-size: 13px; font-weight: 500; cursor: pointer; background: var(--green-800); color: #fff; transition: all 0.15s; white-space: nowrap; }
.add-btn:hover { background: var(--green-700); }

/* ── Suggestions dropdown ── */
.suggestions { margin-top: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; max-height: 200px; overflow-y: auto; }
.suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center; transition: background 0.1s; border-bottom: 1px solid var(--border); }
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: var(--green-50); }
.suggestion-name { font-weight: 500; }
.suggestion-meta { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
.no-results { padding: 10px 12px; font-size: 12px; color: var(--muted); font-style: italic; }

.search-status { font-size: 11px; margin-top: 6px; font-style: italic; }
.search-status.ok  { color: var(--green-700); }
.search-status.err { color: var(--red); }

.empty-week { text-align: center; padding: 80px 40px; color: var(--muted); }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--green-900); color: #fff; padding: 12px 18px; border-radius: var(--radius); font-size: 13px; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
  .main { padding: 20px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
}

/* ── Sync indicator ── */
.sync-dot { width:8px; height:8px; border-radius:50%; background:#52B788; display:inline-block; margin-right:6px; }
.sync-dot.saving { background: #F59E0B; animation: pulse 0.8s infinite; }
.sync-dot.error  { background: #EF4444; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.sync-status { font-size:10px; opacity:0.7; display:flex; align-items:center; padding:8px 16px 0; }

/* ── Calc button in sidebar ── */
.nav-calc-link { margin: 12px 12px 4px; padding: 10px 14px; border-radius: var(--radius); background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color:#fff; font-size:13px; font-weight:500; cursor:pointer; text-align:left; transition:all 0.15s; display:flex; align-items:center; gap:8px; }
.nav-calc-link:hover { background: rgba(255,255,255,0.15); }
.nav-calc-link.active { background: rgba(255,255,255,0.18); border-color: var(--green-600); }

/* ── Calculator inline ── */

/* Calc controls */
.calc-controls { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:20px; }
.calc-field { display:flex; flex-direction:column; gap:4px; }
.calc-field label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
.calc-select, .calc-input { padding:8px 12px; border-radius:var(--radius); border:1px solid var(--border); font-size:13px; font-family:'DM Sans',sans-serif; background:var(--surface); color:var(--text); }
.calc-select:focus, .calc-input:focus { outline:none; border-color:var(--green-600); }
.calc-input { font-family:'DM Mono',monospace; font-weight:600; color:var(--green-700); }

/* Results table */
.calc-results { background:var(--bg); border-radius:var(--radius); overflow:hidden; }
.calc-results-header { padding:10px 16px; background:var(--green-800); color:#fff; font-size:12px; font-weight:600; display:grid; grid-template-columns:1fr 100px 100px; }
.calc-row { display:grid; grid-template-columns:1fr 100px 100px; padding:8px 16px; border-bottom:1px solid var(--border); font-size:12px; align-items:center; }
.calc-row:last-child { border-bottom:none; }
.calc-row:hover { background:var(--green-50); }
.calc-row.group-header { background:var(--green-50); font-weight:600; font-size:11px; color:var(--green-800); text-transform:uppercase; letter-spacing:0.5px; padding:6px 16px; }
.calc-ingr-name { color:var(--text); }
.calc-qty { font-family:'DM Mono',monospace; font-weight:600; color:var(--green-700); text-align:right; }
.calc-qty-raw { font-family:'DM Mono',monospace; color:var(--muted); font-size:11px; text-align:right; }
.btn-primary { padding:8px 18px; border-radius:var(--radius); border:none; background:var(--green-800); color:#fff; font-size:13px; font-weight:500; cursor:pointer; }
.btn-primary:hover { background:var(--green-700); }
.btn-secondary { padding:8px 18px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; cursor:pointer; }
.calc-empty { text-align:center; padding:40px; color:var(--muted); font-size:14px; }
.calc-total-note { font-size:11px; color:var(--muted); margin-top:12px; font-style:italic; }

/* ── Production column ── */
.prod-col { font-family:'DM Mono',monospace; font-size:12px; font-weight:600; color:#fff; background:var(--green-700); text-align:center; padding:5px 8px; border-radius:5px; min-width:72px; display:inline-block; }
.prod-col.zero { background:var(--border); color:var(--muted); }
.prod-header { font-size:10px; font-weight:700; color:var(--green-700); text-align:center; text-transform:uppercase; letter-spacing:0.5px; }
.clients-bar { display:flex; align-items:center; gap:10px; background:var(--green-50); border:1px solid var(--green-200); border-radius:var(--radius); padding:8px 16px; margin-bottom:20px; }
.clients-bar label { font-size:12px; font-weight:600; color:var(--green-800); white-space:nowrap; }
.clients-input { width:70px; padding:5px 10px; border-radius:6px; border:1.5px solid var(--green-600); text-align:center; font-size:15px; font-family:'DM Mono',monospace; font-weight:700; color:var(--green-800); background:#fff; }
.clients-input:focus { outline:none; border-color:var(--green-700); }
.clients-hint { font-size:11px; color:var(--green-700); }

/* ── Move meal ── */
.move-btn { background:none; border:1px solid var(--border); cursor:pointer; font-size:11px; color:var(--muted); padding:3px 8px; border-radius:5px; transition:all 0.15s; white-space:nowrap; }
.move-btn:hover { color:var(--green-700); border-color:var(--green-600); background:var(--green-50); }
.move-panel { background:var(--green-50); border-top:1px solid var(--green-200); padding:12px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.move-panel label { font-size:11px; font-weight:600; color:var(--green-800); text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
.move-select { padding:5px 10px; border-radius:6px; border:1px solid var(--green-300); font-size:12px; background:#fff; color:var(--text); font-family:'DM Sans',sans-serif; }
.move-select:focus { outline:none; border-color:var(--green-600); }
.move-confirm { padding:5px 14px; border-radius:6px; border:none; background:var(--green-800); color:#fff; font-size:12px; font-weight:500; cursor:pointer; }
.move-confirm:hover { background:var(--green-700); }
.move-cancel { padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:#fff; color:var(--muted); font-size:12px; cursor:pointer; }
.move-cancel:hover { color:var(--red); border-color:var(--red); }

/* ── Recipe search ── */
.recipe-search-area { padding:10px 16px 0; border-top:1px dashed var(--green-200); background:var(--green-50); }
.recipe-search-label { font-size:10px; font-weight:700; color:var(--green-700); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; display:block; }
.recipe-search-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.recipe-input { flex:1; min-width:200px; padding:7px 12px; border-radius:var(--radius); border:1px solid var(--green-300); font-size:12px; font-family:'DM Sans',sans-serif; background:#fff; color:var(--text); }
.recipe-input:focus { outline:none; border-color:var(--green-600); }
.recipe-input::placeholder { color:var(--muted); }
.recipe-suggestions { background:#fff; border:1px solid var(--green-200); border-radius:var(--radius); overflow:hidden; max-height:220px; overflow-y:auto; margin-top:4px; }
.recipe-item { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border); transition:background 0.1s; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.recipe-item:last-child { border-bottom:none; }
.recipe-item:hover { background:var(--green-50); }
.recipe-item-name { font-size:12px; font-weight:500; color:var(--text); }
.recipe-item-meta { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; white-space:nowrap; }
.recipe-no-results { padding:10px 12px; font-size:12px; color:var(--muted); font-style:italic; }

/* ── Recipe confirm dialog ── */
.recipe-confirm { background:#fff; border:1px solid var(--green-200); border-radius:var(--radius); padding:12px 14px; margin-top:6px; display:none; }
.recipe-confirm-title { font-size:12px; font-weight:600; color:var(--green-800); margin-bottom:8px; }
.recipe-confirm-btns { display:flex; gap:8px; flex-wrap:wrap; }
.recipe-btn { padding:6px 14px; border-radius:6px; border:none; font-size:12px; font-weight:500; cursor:pointer; }
.recipe-btn-replace { background:var(--green-800); color:#fff; }
.recipe-btn-replace:hover { background:var(--green-700); }
.recipe-btn-add { background:#1565C0; color:#fff; }
.recipe-btn-add:hover { background:#1976D2; }
.recipe-btn-cancel { background:none; border:1px solid var(--border); color:var(--muted); }
.recipe-btn-cancel:hover { color:var(--red); border-color:var(--red); }

/* ── Recipe library view ── */
.library-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:20px; }
.library-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; cursor:default; }
.library-card-name { font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; }
.library-card-meta { font-size:11px; color:var(--muted); font-family:'DM Mono',monospace; margin-bottom:8px; }
.library-card-ingr { font-size:11px; color:var(--muted); }
.library-search { padding:10px 14px; border-radius:var(--radius-lg); border:1px solid var(--border); font-size:14px; width:100%; font-family:'DM Sans',sans-serif; margin-bottom:6px; }
.library-search:focus { outline:none; border-color:var(--green-600); }
.library-count { font-size:12px; color:var(--muted); margin-bottom:16px; }

/* ── Plan toggle ── */
.plan-toggle { display:flex; gap:8px; margin:16px 12px 0; }
.plan-btn { flex:1; padding:9px 14px; border-radius:var(--radius); border:1.5px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.1); color:#fff; font-size:13px; font-weight:600; cursor:pointer; text-align:center; transition:all 0.15s; }
.plan-btn.active { background:#fff; color:var(--green-900); border-color:#fff; }
.plan-badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
.plan-badge-1500 { background:var(--green-600); color:#fff; }
.plan-badge-2000 { background:#FF6D05; color:#fff; }
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSJh4fuvANnzboE8sFWBlJdEFkXtTGBV0",
  authDomain: "yutri-control-de-menu.firebaseapp.com",
  databaseURL: "https://yutri-control-de-menu-default-rtdb.firebaseio.com",
  projectId: "yutri-control-de-menu",
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const MENU_REF = ref(db, "menus/semanas");

// ── Expose Firebase helpers to global scope ────────────────────────────────
window._fbSave = function(data) {
  set(MENU_REF, data).catch(e => console.warn("Firebase save error:", e));
};
window._fbListen = function(cb) {
  onValue(MENU_REF, snap => {
    if (snap.exists()) cb(snap.val());
  });
};
window._fbReady = true;

// Init: trigger renderAll once Firebase module is loaded
document.addEventListener("DOMContentLoaded", () => {
  if (window._initYutri) window._initYutri();
});
</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-text">Yutri</div>
      <div class="logo-sub" id="planLabel">Gestor de menús · 1500 kcal</div>
    </div>
    <div class="plan-toggle">
      <button class="plan-btn active" id="btn1500" onclick="switchPlan(1500)">1500 kcal</button>
      <button class="plan-btn" id="btn2000" onclick="switchPlan(2000)">2000 kcal</button>
      <button class="plan-btn" id="btnAlmuerzos" onclick="switchPlan('almuerzos')">🍽 Almuerzos</button>
    </div>
    <div class="nav-section" id="sidebarNav"></div>
    <div id="syncStatus" class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">Conectando...</span></div>
  <div class="nav-calc-link" id="navCalc" onclick="showCalc()">🧮 Calculadora de producción</div>
  <div class="nav-calc-link" id="navLista" onclick="showListaCompras()" style="display:none">🛒 Lista de compras</div>
  <div class="sidebar-footer">Plan 1500 / 2000 kcal</div>
  </aside>
  <main class="main">
    <div class="page-header">
      <div class="page-title" id="pageTitle">Lunes — Semana 1</div>
      <div class="page-meta" id="pageMeta"></div>
    </div>
    <div class="clients-bar">
      <label>👥 Clientes a cocinar:</label>
      <input class="clients-input" type="number" id="globalClients" value="1" min="1" max="999" oninput="updateProductionCols()">
      <span class="clients-hint" id="clientsHint">Ingresá la cantidad para ver los totales de producción en cada plato</span>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div id="mealsContainer"></div>
  </main>
  <div id="calcView" style="display:none;flex:1;overflow-y:auto;"></div>
  <div id="listaView" style="display:none;flex:1;overflow-y:auto;padding:24px;"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════

// ── Búsqueda por similitud ────────────────────────────────────────────────────
function normalize(s) {
  return s.toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g,"");
}

function similarity(a, b) {
  a = normalize(a); b = normalize(b);
  if (a === b) return 1;
  if (b.includes(a) || a.includes(b)) return 0.9;
  const aW = a.split(" "); const bW = b.split(" ");
  const matches = aW.filter(w => bW.some(bw => bw.includes(w) || w.includes(bw))).length;
  return matches / Math.max(aW.length, bW.length);
}

function searchIngredient(query) {
  if (!query || query.length < 2) return [];
  const results = Object.entries(DB).map(([name, vals]) => ({
    name, vals, score: similarity(query, name)
  })).filter(r => r.score > 0.25)
    .sort((a,b) => b.score - a.score)
    .slice(0, 6);
  return results;
}

function lookup(name) {
  const k = normalize(name);
  if (DB[name]) return DB[name];
  const direct = Object.keys(DB).find(key => normalize(key) === k);
  if (direct) return DB[direct];
  const results = searchIngredient(name);
  return results.length ? results[0].vals : [0,0,0,0];
}

function mkIngr(name, g) {
  const [kcal100, p100, f100, c100] = lookup(name);
  return { name, g, kcal100, p100, f100, c100 };
}

function saveWeekLabel(w, label){

  weekLabels[w] = label;

function startEditWeekLabel(w, el){
  const current = getWeekLabel(w);
  const input = document.createElement('input');
  input.value = current;
  input.style.cssText = 'width:100%;font-size:13px;font-weight:600;padding:2px 4px;border:1px solid var(--green);border-radius:4px;background:var(--surface);color:var(--text);font-family:inherit;';
  input.onclick = e => e.stopPropagation();
  input.onkeydown = e => {
    if(e.key==='Enter'){ saveWeekLabel(w, input.value); }
    if(e.key==='Escape'){ renderSidebar(); }
  };
  input.onblur = () => saveWeekLabel(w, input.value);
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();
}

// ── Calcs ─────────────────────────────────────────────────────────────────────
function calcIngr(i) {
  return {
    kcal: +(i.g * i.kcal100 / 100).toFixed(1),
    p:    +(i.g * i.p100   / 100).toFixed(1),
    f:    +(i.g * i.f100   / 100).toFixed(1),
    c:    +(i.g * i.c100   / 100).toFixed(1),
  };
}
function mealTotal(meal) {
  return meal.ingredientes.reduce((a,i)=>{
    const v=calcIngr(i); return {kcal:a.kcal+v.kcal,p:a.p+v.p,f:a.f+v.f,c:a.c+v.c};
  },{kcal:0,p:0,f:0,c:0});
}
function dayTotal() {
  return (state[currentWeek][currentDay]||[]).reduce((a,meal)=>{
    const t=mealTotal(meal); return {kcal:a.kcal+t.kcal,p:a.p+t.p,f:a.f+t.f,c:a.c+t.c};
  },{kcal:0,p:0,f:0,c:0});
}

}

// ── Render sidebar ────────────────────────────────────────────────────────────
function renderSidebar() {
  let html="";
  Object.entries(state).forEach(([week,days])=>{
    const wA = week===currentWeek;
    const label = getWeekLabel(week);
    html+=`<div class="nav-label" style="display:flex;align-items:center;justify-content:space-between;gap:4px;opacity:1;padding:0 12px;margin-bottom:6px;">
      <span style="font-size:10px;opacity:0.5;letter-spacing:1px;text-transform:uppercase;" id="wlabel_${week.replace(/\s/g,'_')}">${label}</span>
      <button onclick="event.stopPropagation();startEditWeekLabel('${week}',document.getElementById('wlabel_${week.replace(/\s/g,'_')}'))" title="Editar nombre" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--green);padding:0 2px;line-height:1;flex-shrink:0;">✎</button>
    </div>`;
    html+=`<div class="nav-week ${wA?"active":""}" onclick="switchWeek('${week}')">
      <span>📋</span><span>${label}</span>
      <span class="badge">${Object.keys(days).length}d</span></div>`;
    if(wA) Object.keys(days).forEach(day=>{
      html+=`<div class="nav-day ${day===currentDay?"active":""}" onclick="switchDay('${day}')">${day}</div>`;
    });
  });
  document.getElementById("sidebarNav").innerHTML=html;
}

// ── Render stats ──────────────────────────────────────────────────────────────
function renderStats() {
  if(currentPlan==='almuerzos'){ document.getElementById("statsBar").innerHTML=''; return; }
  const t=dayTotal(); const kcal=Math.round(t.kcal); const diff=kcal-PLAN_KCAL;
  const planTarget = (typeof currentPlan !== "undefined") ? currentPlan : 1500;
  const diff2=kcal-planTarget; const cls=Math.abs(diff2)<=100?"ok":Math.abs(diff2)<=200?"warn":"bad";
  document.getElementById("statsBar").innerHTML=`
    <div class="stat-card"><div class="stat-label">Calorías totales</div>
      <div class="stat-value ${cls}">${kcal}</div><div class="stat-diff">Meta: ${planTarget} kcal</div></div>
    <div class="stat-card"><div class="stat-label">Diferencia</div>
      <div class="stat-value ${cls}">${diff2>=0?"+":""}${diff2}</div><div class="stat-diff">vs plan ${planTarget}</div></div>

}

// ── Ingredient search & add ───────────────────────────────────────────────────
function showSuggestions(mi) {
  const query = document.getElementById(`ai_${mi}`).value;
  const box = document.getElementById(`sug_${mi}`);
  if (!query || query.length < 2) { box.style.display="none"; return; }
  const results = searchIngredient(query);
  if (!results.length) {
    box.innerHTML = `<div class="no-results">No encontrado. Intentá con otro nombre.</div>`;
    box.style.display = "block"; return;
  }
  box.innerHTML = results.map(r =>
    `<div class="suggestion-item" onclick="addIngredient(${mi},'${r.name.replace(/'/g,"\\'")}')">
      <span class="suggestion-name">${r.name}</span>
      <span class="suggestion-meta">${r.vals[0]} kcal · ${r.vals[1]}g P · ${r.vals[2]}g G · ${r.vals[3]}g CH</span>
    </div>`
  ).join("");
  box.style.display = "block";
}

function hideSuggestions(mi) {
  const box = document.getElementById(`sug_${mi}`);
  if (box) box.style.display = "none";
}

function addTopResult(mi) {
  const query = document.getElementById(`ai_${mi}`).value.trim();
  if (!query) return;
  const results = searchIngredient(query);
  if (results.length) {
    addIngredient(mi, results[0].name);
  } else {
    const ss = document.getElementById(`ss_${mi}`);
    ss.className = "search-status err";
    ss.textContent = `"${query}" no está en la base de datos. Probá con otro nombre.`;
    setTimeout(()=>{ ss.textContent=""; }, 4000);
  }
}

function addIngredient(mi, name) {
  const newIngr = mkIngr(name, 100);
  state[currentWeek][currentDay][mi].ingredientes.push(newIngr);
  document.getElementById(`ai_${mi}`).value = "";
  hideSuggestions(mi);
  const ss = document.getElementById(`ss_${mi}`);
  ss.className = "search-status ok";
  ss.textContent = `✓ "${newIngr.name}" agregado — ${newIngr.kcal100} kcal/100g. Ajustá los gramos en la tabla.`;
  setTimeout(()=>{ ss.textContent=""; }, 5000);
  renderMeals(); renderStats();
  toast(`"${name}" agregado`);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function toggleMeal(mi) {
  state[currentWeek][currentDay][mi].open = !state[currentWeek][currentDay][mi].open;
  document.getElementById(`mb_${mi}`)?.classList.toggle("collapsed");
}

function updateGram(mi, ii, val) {
  state[currentWeek][currentDay][mi].ingredientes[ii].g = parseFloat(val)||0;
  const meal = state[currentWeek][currentDay][mi];
  const tot = mealTotal(meal);
  const ingr = meal.ingredientes[ii];
  const v = calcIngr(ingr);
  // update row
  const tbody = document.getElementById(`tbody_${mi}`);
  if (tbody && tbody.rows[ii]) {
    tbody.rows[ii].cells[3].textContent = v.kcal.toFixed(1);
    tbody.rows[ii].cells[4].textContent = v.p.toFixed(1);
    tbody.rows[ii].cells[5].textContent = v.f.toFixed(1);
    tbody.rows[ii].cells[6].textContent = v.c.toFixed(1);
  }
  // update prod col for this row
  const prodCell = document.getElementById(`prod_${mi}_${ii}`);
  if (prodCell) {
    const clients = parseInt(document.getElementById("globalClients")?.value)||1;
    const newG = parseFloat(val)||0;
    const txt = fmtProd(newG, clients);
    prodCell.innerHTML = `<span class="prod-col${newG===0?" zero":""}">${txt}</span>`;
  }
  // update meal totals
  document.getElementById(`mkcal_${mi}`).textContent = Math.round(tot.kcal)+" kcal";
  document.getElementById(`tt_kcal_${mi}`).textContent = Math.round(tot.kcal);
  document.getElementById(`tt_p_${mi}`).textContent = tot.p.toFixed(1);
  document.getElementById(`tt_f_${mi}`).textContent = tot.f.toFixed(1);
  document.getElementById(`tt_c_${mi}`).textContent = tot.c.toFixed(1);
  renderStats();
}

function deleteIngr(mi, ii) {
  const name = state[currentWeek][currentDay][mi].ingredientes[ii].name;
  state[currentWeek][currentDay][mi].ingredientes.splice(ii,1);
  renderMeals(); renderStats();
  toast(`"${name}" eliminado`);
}

function switchWeek(w) { currentWeek=w; currentDay=Object.keys(state[w])[0]; showMenus(); renderAll(); }
function switchDay(d)   { currentDay=d; showMenus(); renderAll(); }

function startEditName(e, mi) {
  e.stopPropagation();
  const span = e.currentTarget;
  const current = state[currentWeek][currentDay][mi].nombre;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'meal-name-input';
  input.value = current;
  span.replaceWith(input);
  input.focus();
  input.select();
  function save() {
    const val = input.value.trim() || current;
    state[currentWeek][currentDay][mi].nombre = val;
    renderMeals();
    saveToFirebase();
  }
  input.addEventListener('blur', save);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = current; input.blur(); }
  });
}


// ══════════════════════════════════════════════════════════════════════════════
// PRODUCTION COLUMNS
// ══════════════════════════════════════════════════════════════════════════════
function fmtProd(grams, clients) {
  const total = grams * clients;
  if (total === 0) return "—";
  if (total >= 1000) {
    const kg = total / 1000;
    return kg % 1 === 0 ? kg + " kg" : kg.toFixed(2).replace(/\.?0+$/,"") + " kg";
  }
  return Math.round(total) + " g";
}

function updateProductionCols() {
  const clients = parseInt(document.getElementById("globalClients")?.value) || 1;
  const hint = document.getElementById("clientsHint");
  if (hint) hint.textContent = clients === 1
    ? "Ingresá la cantidad para ver los totales de producción en cada plato"
    : `Producción para ${clients} clientes`;

  const meals = state[currentWeek][currentDay] || [];
  meals.forEach((meal, mi) => {
    meal.ingredientes.forEach((ingr, ii) => {
      const cell = document.getElementById(`prod_${mi}_${ii}`);
      if (!cell) return;
      const g = parseFloat(ingr.g) || 0;
      const total = g * clients;
      const txt = fmtProd(g, clients);
      cell.innerHTML = `<span class="prod-col${total===0?" zero":""}">${txt}</span>`;
    });
    // Update tfoot prod total (total grams of all ingrs * clients)
    const totCell = document.getElementById(`tt_prod_${mi}`);
    if (totCell) {
      const totalG = meal.ingredientes.reduce((s,i)=>s+(parseFloat(i.g)||0),0);
      totCell.innerHTML = `<span class="prod-col" style="font-size:11px;">${fmtProd(totalG,clients)}</span>`;
    }
  });
}

// MOVE MEAL
// ══════════════════════════════════════════════════════════════════════════════
function toggleMovePanel(mi) {
  const panel = document.getElementById(`movePanel_${mi}`);
  if (!panel) return;
  const isOpen = panel.style.display !== "none";
  // Close all panels first
  document.querySelectorAll('[id^="movePanel_"]').forEach(p => p.style.display = "none");
  if (!isOpen) {
    panel.style.display = "flex";
    // Pre-fill with current week/day
    const semSel = document.getElementById(`moveSem_${mi}`);
    const diaSel = document.getElementById(`moveDia_${mi}`);
    const tSel   = document.getElementById(`moveTiempo_${mi}`);
    if (semSel) semSel.value = currentWeek;
    if (diaSel) diaSel.value = currentDay;
    if (tSel)   tSel.value   = state[currentWeek][currentDay][mi].tiempo;
  }
}

function confirmMove(mi) {
  const destWeek   = document.getElementById(`moveSem_${mi}`).value;
  const destDay    = document.getElementById(`moveDia_${mi}`).value;
  const destTiempo = document.getElementById(`moveTiempo_${mi}`).value;

  // Get the meal to move
  const meal = state[currentWeek][currentDay][mi];
  const isSameSpot = destWeek === currentWeek && destDay === currentDay && destTiempo === meal.tiempo;
  if (isSameSpot) {
    toast("El plato ya está en esa posición");
    toggleMovePanel(mi);
    return;
  }

  // Update tiempo label
  const movedMeal = { ...meal, tiempo: destTiempo, open: true };

  // Remove from origin
  state[currentWeek][currentDay].splice(mi, 1);

  // Ensure destination exists
  if (!state[destWeek]) state[destWeek] = {};
  if (!state[destWeek][destDay]) state[destWeek][destDay] = [];

  // Insert at correct position by tiempo order
  const order = ["Desayuno","Almuerzo","Merienda","Cena","Colación"];
  const destMeals = state[destWeek][destDay];
  const insertIdx = destMeals.findIndex(m => order.indexOf(m.tiempo) > order.indexOf(destTiempo));
  if (insertIdx === -1) destMeals.push(movedMeal);
  else destMeals.splice(insertIdx, 0, movedMeal);

  const sameDay = destWeek === currentWeek && destDay === currentDay;
  toast(`"${movedMeal.nombre}" movido a ${destTiempo} del ${destDay} (${destWeek})`);
  saveToFirebase();

  if (sameDay) {
    renderAll();
  } else {
    // Navigate to destination
    currentWeek = destWeek;
    currentDay  = destDay;
    renderAll();
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// RECIPE SEARCH & APPLY
// ══════════════════════════════════════════════════════════════════════════════
let pendingRecipe = null; // { mi, recipe }

function searchRecipes(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return RECIPES_DB.filter(r => {
    const n = r.nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    return n.includes(q);
  }).slice(0, 8);
}

function showRecipeSuggestions(mi) {
  const input = document.getElementById(`ri_${mi}`);
  const box = document.getElementById(`rsug_${mi}`);
  if (!input || !box) return;
  const query = input.value;
  if (!query || query.length < 2) { box.style.display="none"; return; }
  const results = searchRecipes(query);
  if (!results.length) {
    box.innerHTML = `<div class="recipe-no-results">No se encontraron recetas con ese nombre.</div>`;
    box.style.display = "block"; return;
  }
  box.innerHTML = results.map((r,i) =>
    `<div class="recipe-item" onclick="selectRecipe(${mi},${RECIPES_DB.indexOf(r)})">
      <span class="recipe-item-name">${r.nombre}</span>
      <span class="recipe-item-meta">${r.kcal} kcal · ${r.ingredientes.length} ingr</span>
    </div>`
  ).join("");
  box.style.display = "block";
}

function hideRecipeSuggestions(mi) {
  const box = document.getElementById(`rsug_${mi}`);
  if (box) box.style.display = "none";
}

function selectRecipe(mi, recipeIdx) {
  const recipe = RECIPES_DB[recipeIdx];
  pendingRecipe = { mi, recipe };
  hideRecipeSuggestions(mi);
  // Show confirm panel
  const confirm = document.getElementById(`rconfirm_${mi}`);
  const title = document.getElementById(`rconfirm_title_${mi}`);
  if (confirm && title) {
    title.textContent = `"${recipe.nombre}" — ${recipe.kcal} kcal, ${recipe.ingredientes.length} ingredientes. ¿Qué querés hacer?`;
    confirm.style.display = "block";
    confirm.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function hideRecipeConfirm(mi) {
  const confirm = document.getElementById(`rconfirm_${mi}`);
  if (confirm) confirm.style.display = "none";
  const input = document.getElementById(`ri_${mi}`);
  if (input) input.value = "";
  pendingRecipe = null;
}

function applyRecipe(mi, mode) {
  if (!pendingRecipe) return;
  const { recipe } = pendingRecipe;
  const meal = state[currentWeek][currentDay][mi];

  // Convert recipe ingredients to hydrated format
  const newIngrs = recipe.ingredientes.map(([name, g]) => mkIngr(name, g));

  if (mode === 'replace') {
    meal.nombre = recipe.nombre;
    meal.ingredientes = newIngrs;
    toast(`Plato reemplazado por "${recipe.nombre}"`);
  } else {
    meal.ingredientes = [...meal.ingredientes, ...newIngrs];
    toast(`Ingredientes de "${recipe.nombre}" agregados`);
  }

  hideRecipeConfirm(mi);
  saveToFirebase();
  renderMeals();
  renderStats();
  setTimeout(updateProductionCols, 0);
}

function renderLibrary(filter) {
  const grid = document.getElementById("libraryGrid");
  const count = document.getElementById("libraryCount");
  if (!grid) return;
  const filtered = filter
    ? RECIPES_DB.filter(r => r.nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(
        filter.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")))
    : RECIPES_DB;
  if (count) count.textContent = `${filtered.length} recetas`;
  grid.innerHTML = filtered.map(r => `
    <div class="library-card">
      <div class="library-card-name">${r.nombre}</div>
      <div class="library-card-meta">${r.kcal} kcal · ${r.prot}g P · ${r.grasas}g G · ${r.ch}g CH</div>
      <div class="library-card-ingr">${r.ingredientes.slice(0,4).map(([n,g])=>`${n} ${g}g`).join(' · ')}${r.ingredientes.length>4?' · ...':''}</div>
    </div>`).join("");
}

function filterLibrary(val) {

}

// PLAN TOGGLE 1500 / 2000 kcal
// ══════════════════════════════════════════════════════════════════════════════
let currentPlan = 1500;

function switchPlan(plan) {
  currentPlan = plan;

  if (plan === 'almuerzos') {
    // Load almuerzos state — simple format, no mkIngr/kcal
    state = {};
    Object.entries(ALMUERZOS_DATA).forEach(([week, days]) => {
      state[week] = {};
      Object.entries(days).forEach(([day, meals]) => {
        state[week][day] = meals.map(meal => ({
          ...meal,
          ingredientes: (meal.ingredientes||[]).map(function(ing){
            if(Array.isArray(ing)) return {nombre:ing[0], g:ing[1]};
            return {nombre:ing.nombre||ing.name||'', g:ing.g||0};
          })
        }));
      });
    });
    document.getElementById('btnAlmuerzos').classList.add('active');
    document.getElementById('btn1500').classList.remove('active');
    document.getElementById('btn2000').classList.remove('active');
    document.getElementById('planLabel').textContent = 'Almuerzos';
    document.getElementById('navCalc').style.display = 'none';
    document.getElementById('navLista').style.display = 'flex';
    currentWeek = Object.keys(ALMUERZOS_DATA)[0]||'Semana 1';
    currentDay = 'Lunes';
    renderAll();
    return;
  }

  // Restore Yutri buttons
  document.getElementById('btnAlmuerzos').classList.remove('active');
  document.getElementById('navCalc').style.display = 'flex';
  document.getElementById('navLista').style.display = 'none';
  // Hide lista view if open
  document.getElementById('listaView').style.display = 'none';
  document.getElementById('navLista').classList.remove('active');

  if (plan === 2000) {
    Object.entries(WEEKS_DATA_2000).forEach(([week, days]) => {
      state[week] = {};
      Object.entries(days).forEach(([day, meals]) => {
        state[week][day] = meals.map(meal => ({
          ...meal, open: true,
          ingredientes: meal.ingredientes.map(([n,g]) => mkIngr(n,g))
        }));
      });
    });
    document.getElementById('btn2000').classList.add('active');
    document.getElementById('btn1500').classList.remove('active');
    document.getElementById('planLabel').textContent = 'Gestor de menús · 2000 kcal';
    PLAN_KCAL = 2000;
  } else {
    Object.entries(WEEKS_DATA).forEach(([week, days]) => {
      state[week] = {};
      Object.entries(days).forEach(([day, meals]) => {
        state[week][day] = meals.map(meal => ({
          ...meal, open: true,
          ingredientes: meal.ingredientes.map(([n,g]) => mkIngr(n,g))
        }));
      });
    });
    // Also load extras
    Object.entries(WEEKS_DATA_EXTRA).forEach(([week, days]) => {
      state[week] = {};
      Object.entries(days).forEach(([day, meals]) => {
        state[week][day] = meals.map(meal => ({
          ...meal, open: true,
          ingredientes: meal.ingredientes.map(([n,g]) => mkIngr(n,g))
        }));
      });
    });
    document.getElementById('btn1500').classList.add('active');
    document.getElementById('btn2000').classList.remove('active');
    document.getElementById('planLabel').textContent = 'Gestor de menús · 1500 kcal';
    PLAN_KCAL = 1500;
  }
  currentWeek = 'Semana 1';
  currentDay  = 'Lunes';
  renderAll();
}

function agregarSemanaAlmuerzos(){
  const nums = Object.keys(ALMUERZOS_DATA).map(k=>parseInt(k.replace(/\D/g,''))||0);
  const next = Math.max(0,...nums)+1;
  const newKey = 'Semana '+next;
  ALMUERZOS_DATA[newKey]={};
  DIAS_CASERO.forEach(d=>{
    ALMUERZOS_DATA[newKey][d]=[{tiempo:"Almuerzo",nombre:"",porciones:2,ingredientes:[],open:true}];
  });
  state[newKey]={};
  DIAS_CASERO.forEach(d=>{
    state[newKey][d]=[{tiempo:"Almuerzo",nombre:"",porciones:2,ingredientes:[],open:true}];
  });
  currentWeek=newKey; currentDay='Lunes';
  saveAlmuerzos();
  renderAlmuerzos();
}

function renderMealsAlmuerzos(){
  const days = state[currentWeek]||{};
  const meal = (days[currentDay]||[{nombre:'',porciones:2,ingredientes:[]}])[0];
  const porciones = meal.porciones||2;

  let h = `<div style="max-width:760px">`;

  // Header card
  h += `<div style="background:#fff;border-radius:12px;border:1px solid #e8e8e5;padding:18px 20px;margin-bottom:14px">`;
  h += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">`;
  h += `<div style="font-size:16px;font-weight:700;color:#2C2C2A">${currentDay}</div>`;
  h += `<div style="display:flex;align-items:center;gap:8px;margin-left:auto">`;
  h += `<span style="font-size:13px;color:#888780">Porciones:</span>`;
  h += `<button onclick="cambiarPorciones(-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#f5f5f3;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1">−</button>`;
  h += `<span style="font-size:18px;font-weight:700;min-width:24px;text-align:center">${porciones}</span>`;
  h += `<button onclick="cambiarPorciones(1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#f5f5f3;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1">+</button>`;
  h += `</div></div>`;

  // Nombre del plato
  h += `<div style="margin-bottom:14px">`;
  h += `<label style="font-size:11px;font-weight:700;color:#888780;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px">Plato del día</label>`;
  h += `<input type="text" value="${(meal.nombre||'').replace(/"/g,'&quot;')}" placeholder="ej: Milanesa con puré, Pollo asado con ensalada..." onchange="updateNombreCasero(this.value)" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;font-family:inherit;color:#2C2C2A">`;
  h += `</div>`;

  // Ingredientes — gramos POR PORCIÓN, total calculado
  h += `<div>`;
  h += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">`;
  h += `<label style="font-size:11px;font-weight:700;color:#888780;text-transform:uppercase;letter-spacing:.5px">Ingredientes</label>`;
  h += `<span style="font-size:11px;color:#888780">Gramos por porción × ${porciones} = total</span>`;
  h += `</div>`;

  // Cabecera de columnas
  h += `<div style="display:grid;grid-template-columns:1fr 90px 110px 20px;gap:6px;margin-bottom:4px;padding:0 2px">`;
  h += `<span style="font-size:10px;color:#aaa;text-transform:uppercase">Ingrediente</span>`;
  h += `<span style="font-size:10px;color:#aaa;text-transform:uppercase;text-align:right">g / porción</span>`;
  h += `<span style="font-size:10px;color:#1D9E75;text-transform:uppercase;text-align:right">Total (${porciones} porc.)</span>`;
  h += `<span></span></div>`;

  if(meal.ingredientes&&meal.ingredientes.length){
    meal.ingredientes.forEach(function(ing,i){
      const gPor = parseFloat(ing.g)||0;
      const gTot = Math.round(gPor * porciones);
      const totLabel = gTot>=1000 ? (gTot/1000).toFixed(2)+' kg' : gTot+'g';
      const totColor = gTot>=1000 ? '#E8621A' : '#1D9E75';
      h+=`<div style="display:grid;grid-template-columns:1fr 90px 110px 20px;gap:6px;margin-bottom:6px;align-items:center">`;
      h+=`<input type="text" value="${(ing.nombre||'').replace(/"/g,'&quot;')}" placeholder="Ingrediente" onchange="updateIngrCasero(${i},'nombre',this.value)" style="padding:7px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:13px;font-family:inherit;width:100%">`;
      h+=`<input type="number" value="${gPor||''}" min="0" placeholder="0" onchange="updateIngrCasero(${i},'g',parseFloat(this.value)||0)" style="padding:7px 8px;border:1px solid #e0e0e0;border-radius:6px;font-size:13px;text-align:right;font-family:inherit;width:100%">`;
      h+=`<div style="text-align:right;font-weight:700;font-size:14px;color:${totColor}">${gTot>0?totLabel:'—'}</div>`;
      h+=`<button onclick="delIngrCasero(${i})" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;padding:0;line-height:1" title="Eliminar">×</button>`;
      h+=`</div>`;
    });
  } else {
    h+=`<div style="color:#aaa;font-size:13px;padding:8px 0">Sin ingredientes todavía. Agregá los que necesitás abajo.</div>`;
  }

  h += `<button onclick="addIngrCasero()" style="margin-top:8px;padding:7px 14px;border:1px dashed #ccc;border-radius:6px;background:#fafaf8;cursor:pointer;font-size:13px;color:#5F5E5A;width:100%">+ Agregar ingrediente</button>`;
  h += `</div></div></div>`;

  document.getElementById("mealsContainer").innerHTML=h;
}

function calcListaComprasCasero(){
  const semana = state[currentWeek]||{};
  const mapa={};
  DIAS_CASERO.forEach(function(d){
    const meals=semana[d]||[];
    meals.forEach(function(m){
      const porc = m.porciones||2;
      (m.ingredientes||[]).forEach(function(ing){
        if(!ing.nombre) return;
        const key=ing.nombre.toLowerCase().trim();
        if(!mapa[key]) mapa[key]={nombre:ing.nombre,total:0};
        // total = gramos por porción × porciones del día
        mapa[key].total += (parseFloat(ing.g)||0) * porc;
      });
    });
  });
  return Object.values(mapa).sort(function(a,b){return a.nombre.localeCompare(b.nombre)});
}

function cambiarPorciones(delta){
  const meal=getCaseroMeal();
  meal.porciones=Math.max(1,(meal.porciones||2)+delta);
  saveAlmuerzos(); renderMealsAlmuerzos();
}
function updateNombreCasero(val){
  const meal=getCaseroMeal(); meal.nombre=val; saveAlmuerzos();
}
function addIngrCasero(){
  const meal=getCaseroMeal();
  meal.ingredientes.push({nombre:'',g:0});
  saveAlmuerzos(); renderMealsAlmuerzos();
}
function updateIngrCasero(i,field,val){
  const meal=getCaseroMeal();
  meal.ingredientes[i][field]=val;
  saveAlmuerzos(); renderMealsAlmuerzos();
}
function delIngrCasero(i){
  const meal=getCaseroMeal();
  meal.ingredientes.splice(i,1);
  saveAlmuerzos(); renderMealsAlmuerzos();
}
function getCaseroMeal(){
  if(!state[currentWeek]) state[currentWeek]={};
  if(!state[currentWeek][currentDay]) state[currentWeek][currentDay]=[{tiempo:"Almuerzo",nombre:"",porciones:2,ingredientes:[]}];
  return state[currentWeek][currentDay][0];
}

// FIREBASE SYNC
// ══════════════════════════════════════════════════════════════════════════════
let isSyncing = false;
let saveTimeout = null;

function setSyncStatus(status, text) {
  const dot  = document.getElementById("syncDot");
  const label = document.getElementById("syncText");
  if (!dot || !label) return;
  dot.className = "sync-dot" + (status === "saving" ? " saving" : status === "error" ? " error" : "");
  label.textContent = text;
}

function saveToFirebase() {
  if (!window._fbSave) return;
  clearTimeout(saveTimeout);
  setSyncStatus("saving", "Guardando...");
  saveTimeout = setTimeout(() => {
    try {
      // Serialize state (remove non-serializable if any)
      const data = JSON.parse(JSON.stringify(state));
      window._fbSave(data);
      setSyncStatus("ok", "Sincronizado ✓");
    } catch(e) {
      setSyncStatus("error", "Error al guardar");
    }
  }, 800);
}

function initFirebaseSync() {
  if (!window._fbListen) {
    setSyncStatus("error", "Sin conexión");
    return;
  }
  setSyncStatus("saving", "Conectando...");
  let firstLoad = true;
  window._fbListen((remoteData) => {
    if (isSyncing) return;
    isSyncing = true;

    if (firstLoad) {
      firstLoad = false;
      // Primera carga: si Firebase tiene datos, usarlos como fuente de verdad completa
      if (remoteData && Object.keys(remoteData).length > 0) {
        Object.keys(remoteData).forEach(week => {
          if (!state[week]) state[week] = {};
          Object.keys(remoteData[week]).forEach(day => {
            const remoteDay = remoteData[week][day];
            if (Array.isArray(remoteDay) && remoteDay.length > 0) {
              state[week][day] = remoteDay.map(meal => ({
                ...meal,
                open: meal.open !== undefined ? meal.open : true,
                ingredientes: (meal.ingredientes || []).map(ingr => {
                  if (ingr.kcal100 !== undefined) return ingr;
                  return mkIngr(ingr.name || ingr[0], ingr.g !== undefined ? ingr.g : ingr[1]);
                })
              }));
            }
          });
        });
        renderAll();
        setSyncStatus("ok", "Sincronizado ✓");
      } else {
        // Firebase vacío: subir estado local como base inicial
        setTimeout(() => {
          if (window._fbSave) window._fbSave(JSON.parse(JSON.stringify(state)));
        }, 500);
        setSyncStatus("ok", "Sincronizado ✓");
      }
    } else {
      // Actualizaciones posteriores (cambios de otro dispositivo)
      Object.keys(remoteData).forEach(week => {
        if (!state[week]) state[week] = {};
        Object.keys(remoteData[week]).forEach(day => {
          const remoteDay = remoteData[week][day];
          if (Array.isArray(remoteDay) && remoteDay.length > 0) {
            state[week][day] = remoteDay.map(meal => ({
              ...meal,
              open: meal.open !== undefined ? meal.open : true,
              ingredientes: (meal.ingredientes || []).map(ingr => {
                if (ingr.kcal100 !== undefined) return ingr;
                return mkIngr(ingr.name || ingr[0], ingr.g !== undefined ? ingr.g : ingr[1]);
              })
            }));
          }
        });
      });
      renderAll();
      setSyncStatus("ok", "Sincronizado ✓");
    }

    setTimeout(() => { isSyncing = false; }, 500);
  });
}

// CALCULADORA DE PRODUCCIÓN
// ══════════════════════════════════════════════════════════════════════════════
function showCalc() {
  // Swap main content with calculator view
  document.querySelector(".main").style.display = "none";
  document.getElementById("calcView").style.display = "block";
  document.getElementById("navCalc").classList.add("active");
  // Render full calculator UI inside calcView
  document.getElementById("calcView").innerHTML = buildCalcUI();
  // Pre-fill week selector with current week
  const wSel = document.getElementById("calcWeek");
  if (wSel) wSel.value = currentWeek;
  runCalc();
}

function showMenus() {
  document.querySelector(".main").style.display = "";
  document.getElementById("calcView").style.display = "none";
  document.getElementById("navCalc").classList.remove("active");
}

function buildCalcUI() {
  return `<div style="padding:32px 40px;">
    <div style="margin-bottom:28px;">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:6px;">
        <button onclick="showMenus()" style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);padding:0;line-height:1;" title="Volver">←</button>
        <div style="font-size:26px;font-weight:600;letter-spacing:-0.5px;">Calculadora de producción</div>
      </div>
      <div style="font-size:13px;color:var(--muted);padding-left:36px;">Ingresá los clientes y seleccioná la semana y día para obtener la lista de compras total.</div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:24px;">
      <div class="calc-controls">
        <div class="calc-field">
          <label>Semana</label>
          <select class="calc-select" id="calcWeek" onchange="runCalc()">
            <option value="Semana 1">Semana 1</option>
            <option value="Semana 2">Semana 2</option>
            <option value="Semana 3">Semana 3</option>
            <option value="Semana 4">Semana 4</option>
            <option value="Semana 2 bis">Semana 2 bis ★</option>
            <option value="Semana 3 bis">Semana 3 bis ★</option>
          <option value="Semana 4 bis">Semana 4 bis ★</option>
          </select>
        </div>
        <div class="calc-field">
          <label>Día</label>
          <select class="calc-select" id="calcDay" onchange="runCalc()">
            <option value="ALL">Semana completa</option>
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sábado">Sábado</option>
          </select>
        </div>
        <div class="calc-field">
          <label>Cantidad de clientes</label>
          <input class="calc-input" type="number" id="calcClients" value="20" min="1" max="999" oninput="runCalc()">
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="calc-total-note" id="calcNote" style="font-size:13px;color:var(--muted);"></div>
      <button class="btn-secondary" onclick="copyCalc()" style="font-size:12px;">📋 Copiar lista</button>
    </div>
    <div id="calcResults"><div class="calc-empty">Seleccioná los parámetros para ver la lista.</div></div>

  <div style="margin-top:40px;">
    <div style="font-size:18px;font-weight:600;margin-bottom:4px;">📚 Base de recetas</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">${RECIPES_DB.length} recetas disponibles — buscá y usá el buscador en cada plato para aplicarlas</div>
    <input class="library-search" type="text" placeholder="Filtrar recetas..." oninput="filterLibrary(this.value)" id="librarySearch">
    <div class="library-count" id="libraryCount">${RECIPES_DB.length} recetas</div>
    <div class="library-grid" id="libraryGrid"></div>
  </div>
  </div>`;
}

function runCalc() {
  const week    = document.getElementById("calcWeek").value;
  const dayVal  = document.getElementById("calcDay").value;
  const clients = parseInt(document.getElementById("calcClients").value) || 1;
  const el      = document.getElementById("calcResults");
  const note    = document.getElementById("calcNote");

  if (!state[week]) { el.innerHTML = '<div class="calc-empty">Semana no disponible.</div>'; return; }

  // Collect all ingredients
  const totals = {}; // { name: totalGrams }
  const byMeal = {}; // { "Desayuno Lunes": { name: grams } }

  const days = dayVal === "ALL" ? Object.keys(state[week]) : [dayVal];
  days.forEach(day => {
    if (!state[week][day]) return;
    state[week][day].forEach(meal => {
      const key = `${meal.tiempo} – ${day}`;
      if (!byMeal[key]) byMeal[key] = {};
      meal.ingredientes.forEach(ingr => {
        const g = parseFloat(ingr.g) || 0;
        const n = ingr.name;
        totals[n] = (totals[n] || 0) + g;
        byMeal[key][n] = (byMeal[key][n] || 0) + g;
      });
    });
  });

  if (!Object.keys(totals).length) {
    el.innerHTML = '<div class="calc-empty">No hay ingredientes para mostrar.</div>';
    return;
  }

  // Format quantity
  function fmt(grams) {
    const total = grams * clients;
    if (total >= 1000) return (total/1000).toFixed(2).replace(/\.?0+$/,"") + " kg";
    return Math.round(total) + " g";
  }
  function fmtRaw(grams) {
    return (grams * clients).toFixed(0) + "g total";
  }

  // Sort alphabetically
  const sorted = Object.entries(totals).sort((a,b) => a[0].localeCompare(b[0]));

  let html = `<div class="calc-results">
    <div class="calc-results-header">
      <span>Ingrediente</span>
      <span style="text-align:right">Por cliente</span>
      <span style="text-align:right">Total (${clients} clientes)</span>
    </div>`;

  sorted.forEach(([name, grams]) => {
    const total = grams * clients;
    const totalFmt = total >= 1000
      ? (total/1000).toFixed(2).replace(/\.?0+$/,"") + " kg"
      : Math.round(total) + " g";
    html += `<div class="calc-row">
      <span class="calc-ingr-name">${name}</span>
      <span class="calc-qty-raw">${grams.toFixed(1)}g</span>
      <span class="calc-qty">${totalFmt}</span>
    </div>`;
  });
  html += "</div>";

  el.innerHTML = html;

  const totalDays = days.length;
  const label = dayVal === "ALL" ? `${totalDays} días (semana completa)` : dayVal;
  note.textContent = `${label} · ${clients} clientes · ${sorted.length} ingredientes distintos`;
}

function copyCalc() {
  const week    = document.getElementById("calcWeek").value;
  const dayVal  = document.getElementById("calcDay").value;
  const clients = parseInt(document.getElementById("calcClients").value) || 1;

  const totals = {};
  const days = dayVal === "ALL" ? Object.keys(state[week]) : [dayVal];
  days.forEach(day => {
    if (!state[week][day]) return;
    state[week][day].forEach(meal => {
      meal.ingredientes.forEach(ingr => {
        const g = parseFloat(ingr.g) || 0;
        totals[ingr.name] = (totals[ingr.name] || 0) + g;
      });
    });
  });

  const lines = [`YUTRI — Lista de producción`, `${week} · ${dayVal === "ALL" ? "Semana completa" : dayVal} · ${clients} clientes`, `─────────────────────────────`, ""];
  Object.entries(totals).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([name, grams]) => {
    const total = grams * clients;
    const fmt = total >= 1000
      ? (total/1000).toFixed(2).replace(/\.?0+$/,"") + " kg"
      : Math.round(total) + " g";
    lines.push(`${name}: ${fmt}  (${grams.toFixed(1)}g/cliente)`);
  });

  navigator.clipboard.writeText(lines.join("\n")).then(() => toast("Lista copiada al portapapeles ✓")).catch(() => toast("No se pudo copiar"));
}

// ── Init ──────────────────────────────────────────────────────────────────────
window._initYutri = function() {
  renderAll();
  initFirebaseSync();
};

if (document.readyState !== "loading") {
  renderAll();
  // Firebase init happens via module onload
  if (window._fbReady) initFirebaseSync();
  else setTimeout(() => { if(window._fbListen) initFirebaseSync(); }, 1500);
} else {
  document.addEventListener("DOMContentLoaded", () => {
    renderAll();
    setTimeout(() => { if(window._fbListen) initFirebaseSync(); }, 1500);
  });
}
